<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Régime d'accomplissement — Aletheia Frameworks</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="container">

  <div class="meta-bar">
    <div class="meta-left">
      <a class="home-icon" href="../index.html" title="Accueil">&#8962;</a>
      <span class="sep">·</span>
      <a class="nav-back" href="../index.html">Aletheia Frameworks</a>
      <span class="sep">·</span>
      <span id="last-updated">Mis à jour —</span>
    </div>
  </div>

  <h1>Régime d'accomplissement</h1>
  <div class="branch-desc">Les rails de l'accomplissement, la trajectoire de vie.</div>

  <p class="placeholder-message">Contenu à venir.</p>

</div>
<script>
(function () {
  var el = document.getElementById('last-updated');
  if (!el) return;
  var path = 'regime-accomplissement/index.html';
  fetch('https://api.github.com/repos/domainController/aletheia-frameworks-site/commits?path=' + encodeURIComponent(path) + '&per_page=1')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data || !data[0]) return;
      var d = new Date(data[0].commit.committer.date);
      var opts = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      el.textContent = 'Mis à jour ' + d.toLocaleString('fr-FR', opts);
    })
    .catch(function () { });
})();
</script>
</body>
</html>
